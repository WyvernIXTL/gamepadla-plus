name: Package Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release:
        description: Upload to last release? (Used to test the workflow.)
        type: boolean
        default: false
        required: true

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            fuse: yes
            snap: yes
          - os: ubuntu-24.04-arm
            fuse: yes
            snap: yes
          - os: windows-latest
            fuse: no
            snap: no
          - os: windows-11-arm
            fuse: no
            snap: no
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install Fuse (Nuitka downloads a very old version of appimage)
        if: ${{ matrix.fuse == 'yes' }}
        run: sudo add-apt-repository -y universe && sudo apt install -y libfuse2

      - name: uv sync
        run: uv sync -p 3.11

      - name: Compile and Package App
        run: task package

      - name: Prepare Snap
        if: ${{ matrix.snap == 'yes' }}
        run: task package:prepare-snap
      - name: Install LXD 5.21 (LXD 6.x cannot create core26 containers, see canonical/lxd#17073)
        if: ${{ matrix.snap == 'yes' }}
        run: |
          sudo snap refresh lxd --channel=5.21/stable || sudo snap install lxd --channel=5.21/stable
          snap list lxd
      - name: Package Snap
        if: ${{ matrix.snap == 'yes' }}
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build-snap
      - name: Log Snap Failure
        if: ${{ matrix.snap == 'yes' && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapcraft-logs
          path: ~/.local/state/snapcraft/log/*.log

      - uses: actions/upload-artifact@v7
        with:
          name: packaged-app-${{ matrix.os }}
          path: |
            *.7z
            *.exe
            *.AppImage
            *.tar.xz
            *.snap
          if-no-files-found: ignore
          compression-level: 0

      - name: Release Snap
        if: ${{ matrix.snap == 'yes' && (github.event_name == 'release' || inputs.release == 'true') }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build-snap.outputs.snap }}
          release: stable

  upload-release:
    runs-on: ubuntu-latest
    needs:
      - build-release
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - uses: actions/download-artifact@v8
        with:
          pattern: packaged-app-*
          merge-multiple: true

      - name: Create SHA512SUM
        run: task package:shasum

      - name: Attest packages
        uses: actions/attest@v4
        with:
          subject-path: |
            *.7z
            *.exe
            *.AppImage
            *.tar.xz
            *.snap
            SHA512SUMS

      - name: Upload To Release
        if: ${{ github.event_name == 'release' || inputs.release == 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            *.7z
            *.exe
            *.AppImage
            *.tar.xz
            *.snap
            SHA512SUMS
