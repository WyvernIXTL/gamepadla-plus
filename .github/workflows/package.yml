name: Package Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release:
        description: Upload to last release? (Used to test the workflow.)
        type: boolean
        default: false
        required: true

jobs:
  build-release:
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.*"
          cache: true

      - name: uv sync
        run: uv sync -p 3.11

      - name: Compile and Package App for Windows x64
        run: task package

      - uses: actions/upload-artifact@v7
        with:
          name: packaged-app-${{ matrix.os }}
          path: |
            *.7z
            *.exe
            *.AppImage
            *.tar.xz
          if-no-files-found: ignore
          compression-level: 0

  upload-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - uses: actions/download-artifact@v8
        with:
          pattern: packaged-app-*
          merge-multiple: true

      - name: Create SHA512SUM
        run: task package:shasum

      - name: Attest packages
        uses: actions/attest@v4
        with:
          subject-path: |
            *.7z
            *.exe
            *.AppImage
            *.tar.xz
            SHA512SUM

      - name: Upload To Release
        if: ${{ github.event_name == 'release' || inputs.release == 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            *.7z
            *.exe
            *.AppImage
            *.tar.xz
            SHA512SUM
