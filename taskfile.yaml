version: "3"

tasks:
  run:
    desc: Run GUI
    aliases:
      - r
    cmds:
      - uv run ./gamepadla_plus {{.CLI_ARGS}}

  check:
    desc: Lint and format project.
    aliases:
      - c
    cmds:
      - uv run ruff check
      - uv run ty check

  try-fix:
    desc: Lint and format project.
    cmds:
      - uv run ruff check --fix
      - uv run ty check --fix

  version:bump:
    desc: |
      Bump release version everywhere (about, snapcraft, README, changelog).
      Usage: task version:bump -- X.Y.Z
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Usage: task version:bump -- X.Y.Z"
    cmds:
      - uv run ./helper/bump_version.py {{.CLI_ARGS}}

  package:windows:compile:
    platforms:
      - windows
    deps:
      - package:fetch-third-party-licenses
    cmd: >
      uv run --only-group package nuitka
      --mode=standalone
      --enable-plugins=pyside6
      --include-data-files=LICENSE.txt=LICENSE.txt
      --include-data-files=THIRD-PARTY-LICENSES.txt=THIRD-PARTY-LICENSES.txt
      --include-data-files=README.md=README.md
      --include-data-files=CHANGELOG.md=CHANGELOG.md
      --noinclude-default-mode=error
      --noinclude-unittest-mode=allow
      --nowarn-mnemonic=unwanted-module
      --assume-yes-for-downloads
      --output-filename="Gamepadla+"
      --output-dir=dist
      --output-folder-name=Gamepadla+
      --windows-icon-from-ico=icon/gamepadla-plus.ico
      --windows-console-mode=hide
      gamepadla_plus

  # Not tested yet
  package:linux:compile:
    platforms:
      - linux
    deps:
      - package:fetch-third-party-licenses
    vars:
      APPIMAGE_NAME:
        sh: uv run ./helper/appimage-name.py
      VERSION:
        sh: uv run ./helper/version.py
    cmd: >
      uv run --only-group package nuitka
      --mode=standalone
      --enable-plugins=pyside6
      --include-data-files=LICENSE.txt=LICENSE.txt
      --include-data-files=THIRD-PARTY-LICENSES.txt=THIRD-PARTY-LICENSES.txt
      --include-data-files=README.md=README.md
      --include-data-files=CHANGELOG.md=CHANGELOG.md
      --noinclude-default-mode=error
      --noinclude-unittest-mode=allow
      --nowarn-mnemonic=unwanted-module
      --assume-yes-for-downloads
      --output-filename="Gamepadla+"
      --output-folder-name=Gamepadla+
      --output-dir=dist
      --linux-app-icon=icon/gamepadla-plus-icon_export-solid.png
      --linux-app-console-mode=disable
      --linux-app-license=MIT
      --linux-create-installer
      --linux-installer-output={{.APPIMAGE_NAME}}
      --product-name="Gamepadla+"
      --product-version={{.VERSION}}
      --company-name="Adam McKellar"
      gamepadla_plus

  package:fetch-third-party-licenses:
    cmds:
      - rm -f THIRD-PARTY-LICENSES.txt
      - >
        uv run --only-group license-fetching pip-licenses
        --with-system
        --from=all
        --format=plain-vertical
        --with-urls
        --with-authors
        --with-license-file
        --output-file THIRD-PARTY-LICENSES.txt
      - cat helper/PYTHON-LICENSE.txt >> THIRD-PARTY-LICENSES.txt

  package:package:windows-installer:
    platforms:
      - windows/amd64
    vars:
      VERSION:
        sh: uv run ./helper/version.py
      SIGNTOOL_PATH:
        sh: uv run ./helper/signtool-path.py
    cmd: iscc /SMsSignGPLA="{{.SIGNTOOL_PATH}} \$p" /DMyAppVersion={{.VERSION}} ./inno-setup.iss 

  package:package:portable:
    platforms:
      - windows/amd64
      - windows/arm64
      - linux/amd64
      - linux/arm64
    vars:
      VERSION:
        sh: uv run ./helper/version.py
    cmds:
      - cmd: 7z a -mmt=6 -mx=9 -ms=on gamepadla-plus-v{{.VERSION}}-windows-x64-portable.7z ./dist/Gamepadla+
        platforms:
          - windows/amd64
      - cmd: 7z a -mmt=6 -mx=9 -ms=on gamepadla-plus-v{{.VERSION}}-windows-arm64-portable.7z ./dist/Gamepadla+
        platforms:
          - windows/arm64
      - cmd: tar -cJf gamepadla-plus-v{{.VERSION}}-linux-x64-portable.tar.xz ./dist/Gamepadla+
        platforms:
          - linux/amd64
      - cmd: tar -cJf gamepadla-plus-v{{.VERSION}}-linux-arm64-portable.tar.xz ./dist/Gamepadla+
        platforms:
          - linux/arm64

  package:package:
    deps:
      - package:package:portable
    platforms:
      - windows/amd64
      - windows/arm64
      - linux/amd64
      - linux/arm64

  package:
    desc: |
      Compiles and packages Gamepadla+.
    platforms:
      - windows/amd64
      - windows/arm64
      - linux/amd64
      - linux/arm64
    cmds:
      # compile
      - task: package:windows:compile
      - task: package:linux:compile

      # rename dist
      - mv ./dist/Gamepadla+.dist/ ./dist/Gamepadla+/

      # package dist
      - task: package:package

  package:prepare-snap:
    cmds:
      - rm -rf dist/gamepadla-plus-snap
      - cp -r dist/Gamepadla+ dist/gamepadla-plus-snap
      - mv -f dist/gamepadla-plus-snap/Gamepadla+ dist/gamepadla-plus-snap/gamepadla-plus

  package:package-snap:
    cmd: snapcraft pack

  package:clean:
    cmds:
      - rm -f *.7z
      - rm -f *.exe
      - rm -f *.tar.xz
      - rm -f *.snap
      - rm -f *.AppImage
      - rm -rf dist/Gamepadla+
      - rm -rf dist/Gamepadla+.build
      - rm -rf dist/Gamepadla+.installer-build
      - rm -rf dist/gamepadla-plus-snap
      - rm -f THIRD-PARTY-LICENSES.txt
      - rm -rf dist/packaged-windows-tobesigned-*

  package:shasum:windows:
    ignore_error: true
    cmds:
      - shasum -a 512 *.exe >> SHA512SUMS-WINDOWS
      - shasum -a 512 *.7z >> SHA512SUMS-WINDOWS

  package:shasum:linux:
    ignore_error: true
    cmds:
      - shasum -a 512 *.tar.xz >> SHA512SUMS-LINUX
      - shasum -a 512 *.AppImage >> SHA512SUMS-LINUX
      - shasum -a 512 *.snap >> SHA512SUMS-LINUX

  package:shasum:
    ignore_error: true
    deps:
      - package:shasum:windows
      - package:shasum:linux

  package:windows:sign:download-artifacts:
    vars:
      WORKFLOW_ID:
        sh: gh run list --workflow package.yml --limit 1 --json databaseId --jq '.[0].databaseId'
    cmds:
      - gh run download {{.WORKFLOW_ID}} --pattern "packaged-windows-tobesigned-*" -D dist

  package:windows:sign:unpack-artifacts:
    cmds:
      - ouch decompress -y ./dist/packaged-windows-tobesigned-windows-latest/gamepadla-plus-v1.9.0-windows-x64-portable.7z --dir ./dist/packaged-windows-tobesigned-windows-latest
      - rm -f ./dist/packaged-windows-tobesigned-windows-latest/gamepadla-plus-v1.9.0-windows-x64-portable.7z
      - ouch decompress -y ./dist/packaged-windows-tobesigned-windows-11-arm/gamepadla-plus-v1.9.0-windows-arm64-portable.7z --dir ./dist/packaged-windows-tobesigned-windows-11-arm
      - rm -f ./dist/packaged-windows-tobesigned-windows-11-arm/gamepadla-plus-v1.9.0-windows-arm64-portable.7z

  package:windows:sign:sign-portable:
    vars:
      SIGNTOOL_PATH:
        sh: uv run ./helper/signtool-path.py
    cmds:
      - "'{{.SIGNTOOL_PATH}}' sign /fd SHA256 /tr http://ts.harica.gr /td SHA256 /a ./dist/packaged-windows-tobesigned-windows-latest/Gamepadla+/Gamepadla+.exe"
      - "'{{.SIGNTOOL_PATH}}' sign /fd SHA256 /tr http://ts.harica.gr /td SHA256 /a ./dist/packaged-windows-tobesigned-windows-11-arm/Gamepadla+/Gamepadla+.exe"

  package:windows:sign:verify-signature-portable:
    vars:
      SIGNTOOL_PATH:
        sh: uv run ./helper/signtool-path.py
    cmds:
      - "'{{.SIGNTOOL_PATH}}' verify /pa /v ./dist/packaged-windows-tobesigned-windows-latest/Gamepadla+/Gamepadla+.exe"
      - "'{{.SIGNTOOL_PATH}}' verify /pa /v ./dist/packaged-windows-tobesigned-windows-11-arm/Gamepadla+/Gamepadla+.exe"

  package:windows:sign:package-portable:
    vars:
      VERSION:
        sh: uv run ./helper/version.py
    cmds:
      - 7z a -mmt=6 -mx=9 -ms=on gamepadla-plus-v{{.VERSION}}-windows-x64-portable.7z ./dist/packaged-windows-tobesigned-windows-latest/Gamepadla+
      - 7z a -mmt=6 -mx=9 -ms=on gamepadla-plus-v{{.VERSION}}-windows-arm64-portable.7z ./dist/packaged-windows-tobesigned-windows-11-arm/Gamepadla+
      # Ouch does not use solid compression.
      # - ouch compress --slow -y ./dist/packaged-windows-tobesigned-windows-latest/Gamepadla+ gamepadla-plus-v{{.VERSION}}-windows-x64-portable.7z
      # - ouch compress --slow -y ./dist/packaged-windows-tobesigned-windows-11-arm/Gamepadla+ gamepadla-plus-v{{.VERSION}}-windows-arm64-portable.7z


  package:windows:sign:download-package-sign:
    cmds:
      - package:fetch-third-party-licenses
