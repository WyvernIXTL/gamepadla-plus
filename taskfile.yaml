version: "3"

tasks:
  run:
    desc: Run GUI
    aliases:
      - r
    cmds:
      - uv run ./gamepadla_plus

  check:
    desc: Lint and format project.
    aliases:
      - c
    cmds:
      - uv run ruff check
      - uv run ty check

  try-fix:
    desc: Lint and format project.
    cmds:
      - uv run ruff check --fix
      - uv run ty check --fix
