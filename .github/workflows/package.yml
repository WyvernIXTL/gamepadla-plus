name: Package Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release:
        description: Upload to last release? (Used to test the workflow.)
        type: boolean
        default: false
        required: true

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: uv sync
        run: uv sync -p 3.11

      - name: Compile and Package App for Windows x64
        run: task compile-win64

      - name: Attest packages
        uses: actions/attest@v4
        with:
          subject-path: |
            gamepadla-plus-windows-x64-installer.exe
            gamepadla-plus-windows-x64-portable.7z

      - name: Upload To Release
        if: ${{ github.event_name == 'release' || inputs.release == 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            gamepadla-plus-windows-x64-portable.7z
            gamepadla-plus-windows-x64-installer.exe
